[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mep-cmap-analyser"
version = "1.4.8"
description = "BIDS-compliant TMS/EMG neurophysiology analysis tool for MEP and CMAP quantification"
readme = "README.md"
license = { file = "LICENSE" }
# GPL-3.0-or-later from v1.4.0; v1.3.3 and earlier were MIT. See NOTICE.
authors = [
    { name = "Justin Andrushko", email = "justin.andrushko@northumbria.ac.uk" }
]
requires-python = ">=3.9"
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=1.5",
    "matplotlib>=3.7",
    "scipy>=1.10",
    "statsmodels>=0.14",
    "PyWavelets>=1.4",
    "Pillow>=9.0",
    "neo>=0.10",
    "pyedflib>=0.1.30",
    "bioread>=3.0",
    # CED Signal MATLAB exports are v7.3, which is HDF5; scipy.io cannot
    # read those at all.
    "h5py>=3.7",
    # Runtime, not tooling. The TMS-RAT add-on fills the official workbook,
    # and while openpyxl was dev-only that output existed in the code and was
    # written for nobody who installed the tool normally. Pure Python, no
    # compiled wheel, so it costs the install nothing.
    "openpyxl>=3.1",
]

[project.optional-dependencies]
# Development and CI tooling. Deliberately NOT in [project] dependencies:
# installing the application to use it should not pull in a test runner or a
# linter, and requirements.txt feeds the PyInstaller builds, where extra
# packages risk being bundled into the shipped binary.
#
#   pip install -e ".[dev]"
#
# pyflakes is not optional in practice. tests/test_gui_detection_wiring.py
# skips its undefined-name check when pyflakes is absent, and that check exists
# because app.py cannot be imported without a working matplotlib Tk backend --
# so most of it is never executed by the suite, and a name that is not in scope
# compiles cleanly and fails only when that GUI path runs in front of a user.
dev = [
    "pytest>=7.0",
    "pyflakes>=3.0",
    # Reading BACK what mep_cmap.docx_writer wrote. The writer itself uses
    # only the standard library, deliberately: python-docx depends on lxml, a
    # compiled wheel, and no shipped feature should need it. But asserting on
    # our own XML only proves it says what we meant; an independent OOXML
    # parser opening the file is what proves Word will.
    "python-docx>=1.1",
]

[project.scripts]
mep-cmap = "mep_cmap:run_app"

[project.urls]
Homepage = "https://github.com/jandrushko/mep-cmap-analyser"
Repository = "https://github.com/jandrushko/mep-cmap-analyser"
"Bug Tracker" = "https://github.com/jandrushko/mep-cmap-analyser/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["mep_cmap*"]

[tool.setuptools.package-data]
# Ship the BIDS-ify (BEP037) schema asset inside the wheel/sdist.
mep_cmap = ["schema/*.json", "assets/*.png"]
